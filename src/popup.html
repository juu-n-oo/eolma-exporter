<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #333;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1ec800;
    }
    .info {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #666;
    }
    .info.error {
      background: #fff0f0;
      color: #d32f2f;
    }
    .section {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #1ec800;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row > * { flex: 1; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #1ec800;
      color: #fff;
    }
    .btn-primary:hover { background: #1ab600; }
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      margin-top: 6px;
    }
    .btn-secondary:hover { background: #e0e0e0; }
    .btn-secondary:disabled {
      color: #aaa;
      cursor: not-allowed;
    }
    .progress {
      display: none;
      margin-top: 12px;
    }
    .progress-bar {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #1ec800;
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>NPay Exporter</h1>

  <div id="status" class="info">페이지 정보를 확인하는 중...</div>

  <div id="controls" style="display:none;">
    <div class="section">
      <label>다운로드 범위</label>
      <select id="rangeType">
        <option value="month" selected>월 선택</option>
        <option value="range">기간 선택</option>
        <option value="all">전체</option>
      </select>
    </div>

    <div id="monthSelect" class="section">
      <div class="row">
        <div>
          <label>년도</label>
          <select id="year"></select>
        </div>
        <div>
          <label>월</label>
          <select id="month"></select>
        </div>
      </div>
    </div>

    <div id="rangeSelect" class="section" style="display:none;">
      <div>
        <label>시작 (년-월)</label>
        <input type="month" id="startMonth" style="margin-bottom:8px;">
      </div>
      <div>
        <label>끝 (년-월)</label>
        <input type="month" id="endMonth">
      </div>
    </div>

    <div class="section">
      <button id="btnCsv" class="btn btn-primary">CSV 다운로드</button>
      <button id="btnExcel" class="btn btn-secondary">Excel 다운로드</button>
    </div>

    <div id="progress" class="progress">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="progressText" class="progress-text"></div>
    </div>
  </div>

  <script src="lib/xlsx.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
