<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>eolma 아이콘 생성기</title>
  <style>
    body { font-family: system-ui; padding: 32px; background: #F5F5F7; }
    h1 { font-size: 20px; margin-bottom: 24px; color: #1D1D1F; }
    .icons { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 24px; }
    .icon-item { text-align: center; }
    .icon-item p { font-size: 12px; color: #86868B; margin-top: 8px; }
    canvas { display: block; border-radius: 22%; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .btn {
      padding: 10px 20px; background: #007AFF; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-right: 8px;
    }
    .btn:hover { background: #0066d6; }
    .note { margin-top: 16px; font-size: 13px; color: #86868B; line-height: 1.6; }
    code { background: #E5E5EA; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>eolma exporter 아이콘 생성기</h1>

  <div class="icons">
    <div class="icon-item">
      <canvas id="c128" width="128" height="128"></canvas>
      <p>128×128</p>
    </div>
    <div class="icon-item">
      <canvas id="c48" width="48" height="48"></canvas>
      <p>48×48</p>
    </div>
    <div class="icon-item">
      <canvas id="c16" width="16" height="16"></canvas>
      <p>16×16</p>
    </div>
  </div>

  <button class="btn" onclick="downloadAll()">모두 다운로드</button>

  <div class="note">
    다운로드한 파일 3개를 <code>src/icons/</code> 폴더에 덮어쓰면 됩니다.<br>
    <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const r = size * 0.22; // corner radius

      // Rounded rect background
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();

      // Gradient background
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, '#1A8FFF');
      grad.addColorStop(1, '#0060DF');
      ctx.fillStyle = grad;
      ctx.fill();

      // White "e" letter
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (size >= 48) {
        const fontSize = Math.round(size * 0.54);
        ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif`;
        ctx.fillText('e', size * 0.50, size * 0.53);
      } else {
        // 16px: simpler, just fill the letter
        ctx.font = `700 ${Math.round(size * 0.65)}px Arial, sans-serif`;
        ctx.fillText('e', size * 0.50, size * 0.54);
      }
    }

    const sizes = [128, 48, 16];
    sizes.forEach(s => drawIcon(document.getElementById('c' + s), s));

    function downloadAll() {
      sizes.forEach(s => {
        const canvas = document.getElementById('c' + s);
        const link = document.createElement('a');
        link.download = `icon${s}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
